<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>❄️ Snow Rider</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #0a1628;
      font-family: Arial, sans-serif;
      color: white;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
      z-index: 10;
      flex-wrap: wrap;
      gap: 5px;
      padding: 0 10px;
    }
    .hud-item {
      background: rgba(0, 0, 0, 0.6);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hud-item span {
      color: #55d7ff;
      font-weight: bold;
      font-size: 16px;
    }

    #menu {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      flex-direction: column;
      gap: 16px;
    }
    #menu.hidden {
      display: none;
    }
    #menu h1 {
      font-size: 42px;
      background: linear-gradient(to bottom, #ffffff, #55d7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }
    #menu p {
      opacity: 0.6;
      font-size: 14px;
    }
    #menu .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #menu button {
      padding: 10px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #55d7ff;
      color: #0a1628;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    #menu button:hover {
      transform: scale(1.05);
      background: #66e8ff;
    }
    #menu .diff-btn {
      background: #1a3a5a;
      color: white;
    }
    #menu .diff-btn:hover {
      background: #2a4a6a;
    }

    #gameover {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      flex-direction: column;
      gap: 12px;
    }
    #gameover.show {
      display: flex;
    }
    #gameover h1 {
      font-size: 36px;
      color: #ff6b6b;
    }
    #gameover .stats {
      display: flex;
      gap: 30px;
      margin: 10px 0;
    }
    #gameover .stats div {
      text-align: center;
    }
    #gameover .stats .num {
      font-size: 28px;
      color: #ffd166;
      font-weight: bold;
    }
    #gameover .stats .label {
      font-size: 11px;
      opacity: 0.5;
      text-transform: uppercase;
    }
    #gameover button {
      padding: 10px 32px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #55d7ff;
      color: #0a1628;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      margin-top: 10px;
    }
    #gameover button:hover {
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      #menu h1 {
        font-size: 28px;
      }
      #menu button {
        padding: 8px 18px;
        font-size: 14px;
      }
      .hud-item {
        font-size: 10px;
        padding: 3px 8px;
      }
      .hud-item span {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-item">🎁 <span id="gifts">0</span></div>
    <div class="hud-item">📏 <span id="distance">0</span>m</div>
    <div class="hud-item">⭐ <span id="best">0</span></div>
    <div class="hud-item">⚡ <span id="speed">0</span> km/h</div>
  </div>

  <!-- MENU -->
  <div id="menu">
    <h1>❄️ SNOW RIDER</h1>
    <p>Steer with A/D or ←/→ • Jump with SPACE</p>
    <div class="btn-group">
      <button class="diff-btn" data-diff="easy">🌊 Cruise</button>
      <button class="diff-btn" data-diff="medium">⛰️ Challenge</button>
      <button class="diff-btn" data-diff="hard">⚡ Extreme</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameover">
    <h1>💥 CRASH</h1>
    <div class="stats">
      <div><div class="num" id="final-dist">0</div><div class="label">Distance</div></div>
      <div><div class="num" id="final-gifts">0</div><div class="label">Gifts</div></div>
      <div><div class="num" id="final-speed">0</div><div class="label">Speed</div></div>
    </div>
    <button id="retry">🔄 Ride Again</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    // ============================================================
    //  SNOW RIDER – Simple Working Version
    //  Controls: A/D or ←/→ to steer | SPACE to jump
    // ============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ─── Canvas size ──────────────────────────────────────────────
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ─── DOM refs ──────────────────────────────────────────────────
    const hudGifts = document.getElementById('gifts');
    const hudDistance = document.getElementById('distance');
    const hudBest = document.getElementById('best');
    const hudSpeed = document.getElementById('speed');
    const menu = document.getElementById('menu');
    const gameover = document.getElementById('gameover');
    const finalDist = document.getElementById('final-dist');
    const finalGifts = document.getElementById('final-gifts');
    const finalSpeed = document.getElementById('final-speed');
    const retryBtn = document.getElementById('retry');

    // ─── State ────────────────────────────────────────────────────
    let best = parseInt(localStorage.getItem('snowrider_best')) || 0;
    hudBest.textContent = best;

    let game = {
      playing: false,
      score: 0,
      gifts: 0,
      distance: 0,
      speed: 0,
      difficulty: 'medium',
      health: 100,
      maxHealth: 100,
      gameOver: false
    };

    // ─── Player ──────────────────────────────────────────────────
    const player = {
      x: W / 2,
      y: H - 120,
      width: 40,
      height: 20,
      vy: 0,
      grounded: true,
      speed: 0
    };

    // ─── World ────────────────────────────────────────────────────
    let obstacles = [];
    let gifts = [];
    let particles = [];
    let trees = [];
    let stars = [];

    // ─── Keys ────────────────────────────────────────────────────
    const keys = { left: false, right: false, jump: false };

    // ─── Difficulty ──────────────────────────────────────────────
    const DIFFICULTY = {
      easy: { speed: 3, maxSpeed: 8, obstacleRate: 60, giftRate: 40, gravity: 0.5, jumpPower: -10 },
      medium: { speed: 5, maxSpeed: 12, obstacleRate: 45, giftRate: 35, gravity: 0.6, jumpPower: -11 },
      hard: { speed: 7, maxSpeed: 16, obstacleRate: 30, giftRate: 30, gravity: 0.7, jumpPower: -12 }
    };

    // ─── Generate stars ──────────────────────────────────────────
    function generateStars() {
      stars = [];
      for (let i = 0; i < 200; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.7,
          size: Math.random() * 2 + 1,
          speed: Math.random() * 0.5 + 0.2
        });
      }
    }
    generateStars();

    // ─── Generate trees ──────────────────────────────────────────
    function generateTrees() {
      trees = [];
      for (let i = 0; i < 50; i++) {
        const x = Math.random() * W;
        const y = Math.random() * (H * 0.3) + H * 0.5;
        trees.push({
          x: x,
          y: y,
          size: 10 + Math.random() * 20,
          type: Math.floor(Math.random() * 3)
        });
      }
    }
    generateTrees();

    // ─── Snow particles ──────────────────────────────────────────
    let snowflakes = [];
    for (let i = 0; i < 150; i++) {
      snowflakes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 1 + 0.5,
        drift: Math.random() * 0.5 - 0.25
      });
    }

    // ─── Ground ──────────────────────────────────────────────────
    const groundY = H - 80;
    const groundHeight = 80;

    // ─── Game functions ──────────────────────────────────────────

    function getDiff() {
      return DIFFICULTY[game.difficulty] || DIFFICULTY.medium;
    }

    function resetGame() {
      game.playing = true;
      game.gameOver = false;
      game.score = 0;
      game.gifts = 0;
      game.distance = 0;
      game.speed = 0;
      game.health = 100;

      player.x = W / 2;
      player.y = groundY - 30;
      player.vy = 0;
      player.grounded = true;

      obstacles = [];
      gifts = [];
      particles = [];

      hudGifts.textContent = '0';
      hudDistance.textContent = '0';
      hudSpeed.textContent = '0';

      gameover.classList.remove('show');
    }

    function spawnObstacle() {
      const diff = getDiff();
      const x = W + 50;
      const y = groundY - 30;
      const type = Math.random() > 0.5 ? 'tree' : 'rock';
      const size = type === 'tree' ? 25 + Math.random() * 15 : 15 + Math.random() * 10;
      obstacles.push({
        x: x,
        y: y - size / 2,
        width: size * 0.8,
        height: size,
        type: type,
        size: size
      });
    }

    function spawnGift() {
      const x = W + 50;
      const y = groundY - 50 - Math.random() * 60;
      gifts.push({
        x: x,
        y: y,
        width: 20,
        height: 20,
        bob: Math.random() * Math.PI * 2,
        collected: false
      });
    }

    function addParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 30 + Math.random() * 30,
          maxLife: 60,
          size: Math.random() * 4 + 2,
          color: color
        });
      }
    }

    function gameOverHandler() {
      game.playing = false;
      game.gameOver = true;

      finalDist.textContent = Math.floor(game.distance);
      finalGifts.textContent = game.gifts;
      finalSpeed.textContent = Math.floor(game.speed * 3.6);

      if (game.distance > best) {
        best = game.distance;
        localStorage.setItem('snowrider_best', String(best));
        hudBest.textContent = best;
      }

      gameover.classList.add('show');
    }

    // ─── Update ──────────────────────────────────────────────────

    function update() {
      if (!game.playing || game.gameOver) return;

      const diff = getDiff();

      // Speed
      game.speed += (diff.speed - game.speed) * 0.01;
      game.speed = Math.min(game.speed, diff.maxSpeed);

      // Distance
      game.distance += game.speed * 0.5;

      // Steering
      const moveSpeed = 6;
      if (keys.left) player.x -= moveSpeed;
      if (keys.right) player.x += moveSpeed;

      // Boundaries
      player.x = Math.max(30, Math.min(W - 30, player.x));

      // Gravity
      player.vy += diff.gravity * 0.5;
      player.y += player.vy;

      // Ground collision
      if (player.y + player.height / 2 >= groundY) {
        player.y = groundY - player.height / 2;
        player.vy = 0;
        player.grounded = true;
      } else {
        player.grounded = false;
      }

      // Jump
      if (keys.jump && player.grounded) {
        player.vy = diff.jumpPower;
        player.grounded = false;
        addParticles(player.x, groundY, '#55d7ff', 10);
      }

      // Player speed (for HUD)
      const speedKmh = Math.floor(game.speed * 3.6);
      hudSpeed.textContent = speedKmh;

      // ─── Spawn obstacles ──────────────────────────────────────
      if (Math.random() < 1 / diff.obstacleRate) {
        spawnObstacle();
      }
      if (Math.random() < 1 / diff.giftRate) {
        spawnGift();
      }

      // ─── Update obstacles ─────────────────────────────────────
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.x -= game.speed * 1.5;

        // Collision with player
        const dx = player.x - ob.x;
        const dy = player.y - ob.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const hitRadius = ob.size * 0.6;

        if (dist < hitRadius + 20) {
          // Crash!
          addParticles(player.x, player.y, '#ff6b6b', 30);
          gameOverHandler();
          return;
        }

        // Remove off screen
        if (ob.x < -50) {
          obstacles.splice(i, 1);
        }
      }

      // ─── Update gifts ─────────────────────────────────────────
      for (let i = gifts.length - 1; i >= 0; i--) {
        const g = gifts[i];
        g.x -= game.speed * 1.5;
        g.bob += 0.05;
        g.y += Math.sin(g.bob) * 0.3;

        // Collision with player
        const dx = player.x - g.x;
        const dy = player.y - g.y;
        if (Math.abs(dx) < 30 && Math.abs(dy) < 30 && !g.collected) {
          g.collected = true;
          game.gifts++;
          hudGifts.textContent = game.gifts;
          addParticles(g.x, g.y, '#ffd166', 15);
          gifts.splice(i, 1);
        }

        // Remove off screen
        if (g.x < -30) {
          gifts.splice(i, 1);
        }
      }

      // ─── Update particles ─────────────────────────────────────
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      // ─── Update snow ──────────────────────────────────────────
      for (const s of snowflakes) {
        s.y += s.speed;
        s.x += s.drift;
        if (s.y > H) {
          s.y = -10;
          s.x = Math.random() * W;
        }
        if (s.x > W) s.x = 0;
        if (s.x < 0) s.x = W;
      }

      // ─── Update stars ─────────────────────────────────────────
      for (const s of stars) {
        s.y += s.speed * 0.2;
        if (s.y > H * 0.7) {
          s.y = -10;
          s.x = Math.random() * W;
        }
      }

      // ─── HUD ──────────────────────────────────────────────────
      hudDistance.textContent = Math.floor(game.distance);
    }

    // ─── Draw ────────────────────────────────────────────────────

    function draw() {
      // Clear
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, '#0a1628');
      gradient.addColorStop(0.5, '#1a2a4a');
      gradient.addColorStop(1, '#2a4a6a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      // Stars
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (const s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Snow
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for (const s of snowflakes) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ground
      const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
      groundGrad.addColorStop(0, '#4a7a9a');
      groundGrad.addColorStop(0.3, '#3a6a8a');
      groundGrad.addColorStop(1, '#2a4a6a');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, groundY, W, groundHeight);

      // Ground line
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(W, groundY);
      ctx.stroke();

      // Trees (background)
      for (const t of trees) {
        const size = t.size;
        // Trunk
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(t.x - size * 0.1, t.y - size * 0.3, size * 0.2, size * 0.3);
        // Leaves
        ctx.fillStyle = '#1a4a2a';
        ctx.beginPath();
        ctx.moveTo(t.x, t.y - size);
        ctx.lineTo(t.x - size * 0.6, t.y - size * 0.3);
        ctx.lineTo(t.x + size * 0.6, t.y - size * 0.3);
        ctx.fill();
        ctx.fillStyle = '#2a5a3a';
        ctx.beginPath();
        ctx.moveTo(t.x, t.y - size * 0.7);
        ctx.lineTo(t.x - size * 0.5, t.y - size * 0.1);
        ctx.lineTo(t.x + size * 0.5, t.y - size * 0.1);
        ctx.fill();
        // Snow
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(t.x, t.y - size * 0.7, size * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Obstacles
      for (const ob of obstacles) {
        if (ob.type === 'tree') {
          // Tree
          ctx.fillStyle = '#3a2a1a';
          ctx.fillRect(ob.x - 4, ob.y + ob.size * 0.1, 8, ob.size * 0.4);
          ctx.fillStyle = '#1a4a2a';
          ctx.beginPath();
          ctx.moveTo(ob.x, ob.y - ob.size * 0.2);
          ctx.lineTo(ob.x - ob.size * 0.5, ob.y + ob.size * 0.2);
          ctx.lineTo(ob.x + ob.size * 0.5, ob.y + ob.size * 0.2);
          ctx.fill();
          ctx.fillStyle = '#2a5a3a';
          ctx.beginPath();
          ctx.moveTo(ob.x, ob.y - ob.size * 0.6);
          ctx.lineTo(ob.x - ob.size * 0.4, ob.y - ob.size * 0.1);
          ctx.lineTo(ob.x + ob.size * 0.4, ob.y - ob.size * 0.1);
          ctx.fill();
        } else {
          // Rock
          ctx.fillStyle = '#5a6a7a';
          ctx.beginPath();
          ctx.ellipse(ob.x, ob.y + ob.size * 0.2, ob.size * 0.5, ob.size * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#6a7a8a';
          ctx.beginPath();
          ctx.ellipse(ob.x - ob.size * 0.1, ob.y + ob.size * 0.1, ob.size * 0.3, ob.size * 0.2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Gifts
      for (const g of gifts) {
        if (g.collected) continue;
        // Glow
        ctx.shadowColor = '#ffd166';
        ctx.shadowBlur = 15;
        // Box
        ctx.fillStyle = '#ffd166';
        ctx.fillRect(g.x - g.width / 2, g.y - g.height / 2, g.width, g.height);
        // Ribbon
        ctx.fillStyle = '#ff4466';
        ctx.fillRect(g.x - 2, g.y - g.height / 2, 4, g.height);
        ctx.fillRect(g.x - g.width / 2, g.y - 2, g.width, 4);
        ctx.shadowBlur = 0;
        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(g.x - g.width / 4, g.y - g.height / 3, g.width / 3, g.height / 6);
      }

      // Player (sled)
      // Shadow
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 10;
      // Body
      ctx.fillStyle = '#55d7ff';
      ctx.shadowColor = 'rgba(85,215,255,0.3)';
      ctx.shadowBlur = 15;
      // Sled shape
      ctx.beginPath();
      ctx.roundRect(player.x - 25, player.y - 8, 50, 16, 5);
      ctx.fill();
      // Seat
      ctx.fillStyle = '#1a3a5a';
      ctx.shadowBlur = 0;
      ctx.fillRect(player.x - 15, player.y - 16, 15, 10);
      // Headlight
      ctx.fillStyle = '#ffffaa';
      ctx.shadowColor = 'rgba(255,255,200,0.5)';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(player.x + 20, player.y - 2, 4, 0, Math.PI * 2);
      ctx.fill();

      // Skis
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#8899aa';
      ctx.fillRect(player.x - 22, player.y + 6, 10, 3);
      ctx.fillRect(player.x + 12, player.y + 6, 10, 3);

      // Glow trail
      if (game.speed > 3) {
        ctx.shadowColor = 'rgba(85,215,255,0.15)';
        ctx.shadowBlur = 30;
        ctx.fillStyle = 'rgba(85,215,255,0.05)';
        ctx.fillRect(player.x - 30, player.y - 15, 10, 30);
        ctx.shadowBlur = 0;
      }

      // Particles
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color || '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // ─── Speed lines ──────────────────────────────────────────
      if (game.speed > 4) {
        const intensity = (game.speed - 4) / 10;
        ctx.strokeStyle = `rgba(255,255,255,${intensity * 0.05})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < 20; i++) {
          const x = Math.random() * W;
          const y = Math.random() * groundY;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - game.speed * 2, y);
          ctx.stroke();
        }
      }

      // Health bar
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(20, H - 40, 150, 10);
      ctx.fillStyle = game.health > 50 ? '#4ecdc4' : '#ff6b6b';
      ctx.fillRect(22, H - 38, (game.health / game.maxHealth) * 146, 6);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '9px Arial';
      ctx.fillText('HP', 8, H - 32);
    }

    // ─── RoundRect polyfill for canvas ──────────────────────────
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (r > w / 2) r = w / 2;
        if (r > h / 2) r = h / 2;
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        return this;
      };
    }

    // ─── Game loop ──────────────────────────────────────────────

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ─── Keyboard ────────────────────────────────────────────────

    document.addEventListener('keydown', function(e) {
      const key = e.key;
      if (key === 'a' || key === 'A' || key === 'ArrowLeft') {
        e.preventDefault();
        keys.left = true;
      }
      if (key === 'd' || key === 'D' || key === 'ArrowRight') {
        e.preventDefault();
        keys.right = true;
      }
      if (key === ' ' || key === 'Space' || key === 'ArrowUp') {
        e.preventDefault();
        keys.jump = true;
      }
    });

    document.addEventListener('keyup', function(e) {
      const key = e.key;
      if (key === 'a' || key === 'A' || key === 'ArrowLeft') {
        e.preventDefault();
        keys.left = false;
      }
      if (key === 'd' || key === 'D' || key === 'ArrowRight') {
        e.preventDefault();
        keys.right = false;
      }
      if (key === ' ' || key === 'Space' || key === 'ArrowUp') {
        e.preventDefault();
        keys.jump = false;
      }
    });

    // ─── Start game ──────────────────────────────────────────────

    function startGame(difficulty) {
      game.difficulty = difficulty || 'medium';
      menu.classList.add('hidden');
      resetGame();
    }

    // Menu buttons
    document.querySelectorAll('.diff-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        startGame(this.dataset.diff);
      });
    });

    retryBtn.addEventListener('click', function() {
      startGame(game.difficulty);
    });

    // ─── Init ────────────────────────────────────────────────────

    // Show initial state
    resetGame();
    game.playing = false;
    menu.classList.remove('hidden');

    // Start loop
    gameLoop();

    // Handle resize
    window.addEventListener('resize', function() {
      resize();
      generateStars();
      generateTrees();
    });

    console.log('❄️ Snow Rider loaded! Controls: A/D to steer, SPACE to jump');
  </script>
</body>
</html>
